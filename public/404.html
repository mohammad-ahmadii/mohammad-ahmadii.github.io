<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages has no server-side rewrite, so a direct load of
      // /projects returns this 404 page. Encode the requested
      // path into a query string, bounce to index.html, and let main.tsx
      // restore the real URL before the router mounts.
      (function () {
        var segmentsToKeep = 1; // project site: keep "/"
        var l = window.location;
        var path =
          l.pathname
            .split("/")
            .slice(0, 1 + segmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(segmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash;
        l.replace(l.origin + path);
      })();
    </script>
  </head>
  <body></body>
</html>
